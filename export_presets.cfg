[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/cards/*/*.json,data/decks/*/*.json"
exclude_filter="tests/*,docs/*,agents/*,get-shit-done/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
/* Phones report 3x or more pixels per CSS pixel. Godot renders the canvas at that density, so the GPU
   fills 2-4x more pixels than the 1600x900 game needs. Capping the ratio at 2 keeps text sharp and
   saves a large share of the GPU work on phones. */
(function () {
  var MAX_PIXEL_RATIO = 2;
  var original = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
  if (!original || !original.get) { return; }
  Object.defineProperty(window, 'devicePixelRatio', {
    get: function () { return Math.min(original.get.call(window) || 1, MAX_PIXEL_RATIO); },
    configurable: true
  });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
